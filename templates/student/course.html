<style>
  .container-class {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
  }
  .course-header {
    background: linear-gradient(135deg, #605ae9, #5049c5);
    color: #fff;
    padding: 25px;
    text-align: center;
    font-size: 24px;
    font-weight: 600;
  }
  .course-details {
    padding: 25px;
  }
  .course-details h2 {
    color: #333;
    font-size: 22px;
    margin-bottom: 15px;
  }
  .course-details p {
    font-size: 16px;
    color: #555;
    margin-bottom: 10px;
  }
  .button-container-class {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }
  .action-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    color: #fff;
    font-weight: 500;
    text-transform: uppercase;
  }
  .enroll-btn {
    background: #605ae9;
  }
  .enroll-btn:hover {
    background: #5049c5;
  }
  .enroll-btn:disabled {
    pointer-events: auto; /* Allows interaction */
    cursor: not-allowed !important;
    opacity: 0.6; /* Adjust as needed */
  }
  .wishlist-btn {
    background: #28a745;
  }
  .wishlist-btn:hover {
    background: #218838;
  }
  .back-btn {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #fff;
    background: #dc3545;
    padding: 10px 15px;
    border-radius: 8px;
    transition: 0.3s;
    font-size: 16px;
    width: fit-content;
    margin-bottom: 20px;
  }
  .back-btn:hover {
    background: #c82333;
  }
  .back-btn i {
    margin-right: 8px;
  }
</style>
<div class="container-class">
  <div class="course-header">Course Details</div>
  <div class="course-details">
    <a href="#" id="back-batches" class="back-btn"><i class="fa fa-arrow-left"></i> Back</a>
    <h2>{{ course.name }}</h2>
    <p><strong>Instructor:</strong> {{ course.instructor }}</p>
    <p><strong>Duration:</strong> {{ course.duration }}</p>
    <!-- <p><strong>Start Date:</strong> {{ course.start_date }}</p> -->
    <p><strong>Description:</strong> {{ course.description }}</p>
    <div class="button-container-class">
      <button class="action-btn enroll-btn" style="opacity: 0.6" disabled>Enrollled</button>
      <!-- <button class="action-btn wishlist-btn">Add to Wishlist</button> -->
    </div>
  </div>
</div>
